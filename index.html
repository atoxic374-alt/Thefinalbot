<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bot Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/truestudio.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100vh; background: #080b14; overflow-x: hidden; }
    body { font-family: 'Cairo', 'Tajawal', system-ui, sans-serif; }
    #bs-root { min-height: 100vh; }

    /* ── Toast / Notification ── */
    .toast-host {
      position: fixed; bottom: 20px; right: 20px; z-index: 9999;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .toast-card {
      background: #161b27; border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px; padding: 10px 14px; color: #e7ecf3;
      font-size: 13px; display: flex; align-items: center; gap: 8px;
      animation: toast-in .2s ease; min-width: 200px; max-width: 340px;
      pointer-events: all; box-shadow: 0 4px 20px rgba(0,0,0,.4);
    }
    .toast-ok  { border-color: rgba(74,222,128,.25); }
    .toast-err { border-color: rgba(255,90,110,.25); }
    @keyframes toast-in {
      from { opacity: 0; transform: translateX(14px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .copy-notification {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #1a2035; border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px; padding: 8px 16px; color: #e7ecf3;
      font-size: 12px; z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="bs-root"></div>
  <script src="src/api.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
